@media(max-width:760px){header{padding:8px 12px;gap:6px}header b{font-size:.82rem}header .btn{padding:8px 12px;font-size:.8rem}#bMenu{display:inline-block}header nav{position:absolute;top:100%;left:0;right:0;background:var(--card);flex-direction:column;padding:10px;border-bottom:1px solid var(--line);display:none}header nav.on{display:flex;animation:fade .2s}.hgx{grid-template-columns:1fr}.two{grid-template-columns:1fr}.side{position:static}.banner{height:170px}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
</style>

</header>
<main id="app" class="wrap"></main>
<footer><p style="margin:0 0 6px"><b>AFRICA E-SCHOOL</b> — Apprendre • Créer • Réussir</p><p style="margin:0"><a href="#/" style="color:#bfe0bd">Accueil</a> · <a href="#/catalogue" style="color:#bfe0bd">Formations</a> · <a href="#/faq" style="color:#bfe0bd">FAQ</a></p></footer>

<div class="pvw" id="pvw"><iframe id="pvf" title="Aperçu du site"></iframe></div></div></div>
<script>
/* ===== CONFIGURATION ===== */
const CONFIG = {
  adminPin: 'CHANGER-CE-CODE',   // Code de l’administration (vérifié dans le navigateur uniquement)
  checkoutEndpoint: '',          // Serveur de paiement (plus tard, quand des formations seront payantes)
  accessEndpoint: ''             // Serveur qui confirme les droits d’accès après paiement
};

/* ===== DONNÉES INITIALES (liens fournis par vous ; toutes gratuites pour le moment) ===== */
const D = (id, title, cat, url, note) => ({id, title, cat, url, note: note || '', desc: 'Description à compléter dans l’administration.', price: '', currency: 'USD', status: 'free', img: 'images/f' + id + '.svg', lessons: [], obj: '', pub: 'published'});
const F = 'https://drive.google.com/drive/folders/';
const DEFAULTS = [
  D(1,'Bonus — Le hack pour avoir Gemini Premium, sans payer','Intelligence artificielle','https://drive.google.com/file/d/1m7aReSwbLtsGolcyQaP86fpSAV-dntlV/view'),
  D(2,'Créer une application web no-code avec Bubble','Informatique',F+'1d0TUUwhyknaQ0iCKX1DDLz38e6_EsLNp'),
  D(3,'Créer des images avec l’IA Midjourney','Design',F+'1140WM9l7dIMDh61nb0ooTS6JfwdlVbtG'),
  D(4,'Blender — Débuter en modélisation 3D : cours complet','Design',F+'11Qm2U9xoNUnHaqMGrhZIYez9ROCjntwn'),
  D(5,'Création de packshot produit 3D avec Blender','Design',F+'1_vFj6t11mwaYmshuOHch7VCQ2nZ_xqkE'),
  D(6,'Bonus — Logiciel de modélisation Blender','Design','','Lien à corriger : l’identifiant fourni semble tronqué (32 caractères).'),
  D(7,'Stratégie marketing — Cours ultime','Marketing',F+'1WySgBZhqoKZofR4wWncjbOsE1M2EP3tM'),
  D(8,'Maîtriser la publicité sur les réseaux sociaux','Marketing',F+'1nosV8St4nH4FjGAxJS9c5uH_fxzpWhoA'),
  D(9,'Démarrer un business dans l’affiliation','Business',F+'1wykRLnb0JS6b84WDhLJXcDjQdGvrkpla'),
  D(10,'ChatGPT de A à Z — Formation ultime pour maîtriser ChatGPT','Intelligence artificielle',F+'1AlQyZTRUvjg8Fpl_am5078mqpWBS6ZLa'),
  D(11,'Vivre de ses livres numériques grâce à ChatGPT','Business',F+'1uz0fZW1a3q8PQNWo_YNAAjLIV6VvdIAU'),
  D(12,'Combiner ChatGPT et Excel pour optimiser son temps de travail','Intelligence artificielle','','Lien à corriger : l’identifiant fourni contient une espace.'),
  D(13,'ChatGPT — Automatiser vos Facebook Ads avec simplicité','Marketing',F+'14Ep_UnKVesXfuTT67sPDYP21jEkfllWt'),
  D(14,'Stratégie pour percer sur TikTok, Instagram et YouTube Shorts','Marketing',F+'1HclMaGTQgYq3Rf6Ynr7fDEuL5-mhd11P'),
  D(15,'Freelance — Débuter efficacement sur ComeUp','Business',F+'1_YYBFizCdezmT4e5uNQzntoEJzj-DBIR')
];

/* ===== STOCKAGE LOCAL (démo) ===== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let courses = store.get('aes_courses_v2', null) || JSON.parse(JSON.stringify(DEFAULTS));
let ent = store.get('aes_ent', []);
let ratings = store.get('aes_ratings', {});
let user = store.get('aes_user', null);
let cat = 'Toutes', term = '';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => store.set('aes_courses_v2', courses);
const imgSrc = p => (window.IMGS && window.IMGS[p]) || p;

/* ===== LIENS GOOGLE DRIVE ===== */
function parseDrive(u){
  u = (u || '').trim();
  if(!u) return {err:'Aucun lien renseigné'};
  if(/\s/.test(u)) return {err:'Le lien contient une espace'};
  let m = u.match(/drive\.google\.com\/(?:file\/d|open\?id=|uc\?id=|drive\/folders)\/?([\w-]+)/);
  if(!m) m = u.match(/drive\.google\.com\/(file\/d|drive\/folders)\/([\w-]+)/);
  if(!m) return {err:'Lien Google Drive non reconnu'};
  let type, id;
  if(m.length===3){ type = m[1] === 'file/d' ? 'file' : 'folder'; id = m[2]; }
  else { type = /folders/.test(u) ? 'folder' : 'file'; id = m[1]; }
  if(!id || id.length < 10) return {err:'Identifiant Drive incomplet'};
  return {type,id};
}
function embedSrc(u){
  const p = parseDrive(u); if(p.err || p.type !== 'file') return null;
  return 'https://drive.google.com/file/d/' + encodeURIComponent(p.id) + '/preview';
}
function driveFolderSrc(u){ const p=parseDrive(u); return !p.err && p.type==='folder' ? 'https://drive.google.com/embeddedfolderview?id='+encodeURIComponent(p.id)+'#list' : null; }


/* ===== ACCÈS ===== */
const isFree = c => c.status === 'free';
const hasAccess = c => isFree(c) ? !!user : ent.includes(c.id); // paiement : à vérifier côté serveur en production
const avg = id => { const r = ratings[id] || []; return r.length ? r.reduce((a,b)=>a+b,0)/r.length : 0; };
const starTxt = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));

/* ===== OUTILS V3 ===== */
const PV = new URLSearchParams(location.search).has('preview');
const log = m => { const l = store.get('aes_log', []); l.push(new Date().toISOString().slice(0,16) + ' ' + m); store.set('aes_log', l.slice(-50)); };
let prog = store.get('aes_prog', {});
const live = () => courses.filter(c => c.pub !== 'draft' && c.pub !== 'archived');
const lessonsOf = c => c.lessons.length ? c.lessons : (parseDrive(c.url).type === 'file' ? [{t:'Contenu de la formation', url:c.url}] : []);
const pct = c => { const n=lessonsOf(c).length; return n ? Math.round(((prog[c.id] && prog[c.id].done || []).length / n) * 100) : 0; };
let fprice = 'all', sort = 'def', cur = null;

/* ===== NAVIGATION ET RETOUR ===== */
let hist = [location.hash || '#/'];
const go = h => { location.hash = h; };
const FALL = h => /^#\/learn\//.test(h) ? '#/course/' + h.split('/')[2] : /^#\/course\//.test(h) ? '#/catalogue' : '#/';
const back = () => hist.length > 1 ? history.back() : go(FALL(location.hash || '#/'));
addEventListener('hashchange', () => { const h = location.hash || '#/'; if(hist.length > 1 && hist[hist.length-2] === h) hist.pop(); else if(hist[hist.length-1] !== h) hist.push(h); route(); });

/* ===== PAGES ===== */
const img = c => c.img ? `<img src="${esc(imgSrc(c.img))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : '';
const bk = '<button class="bk" data-back>← Retour</button>';
function card(c){

  <div class="banner">${img(c)}</div><div class="two"><div><h1 style="margin:0 0 8px;font-size:clamp(1.4rem,3.5vw,2.2rem)">${esc(c.title)}</h1><p>${esc(c.desc)}</p>

      <div class="lesson-main">
        <div class="lesson-player" id="lessonPlayer" aria-live="polite"><div class="player-message" id="playerMessage"><span class="spin" aria-hidden="true"></span><span>Préparation de la leçon…</span></div></div>
        <h2 id="activeLessonTitle" class="lesson-title">${esc(L[i].t)}</h2>
        <div class="lesson-tools"><button class="btn alt" data-ls="${i-1}" ${i===0?'disabled':''}>← Précédente</button><button class="btn" data-ls="${i+1}" ${i>=L.length-1?'disabled':''}>Suivante →</button><button class="btn lime" data-fin="${i}">✓ Marquer terminée</button><button class="btn alt" data-cinema>Mode cinéma</button><button class="btn alt" data-fullscreen>Plein écran</button><button class="btn alt" data-toggle-lessons aria-expanded="true">Masquer les leçons</button></div>

      </div>
      <aside class="lesson-sidebar" id="lessonSidebar"><h3 style="margin:0">Contenu du cours</h3><div class="lesson-search"><input id="lessonFilter" type="search" placeholder="Rechercher une leçon" aria-label="Rechercher une leçon"></div><div class="les" id="lessonList">${L.map((l,k)=>`<button class="${k===i?'on':''} ${(pr.done||[]).includes(k)?'dn':''}" data-ls="${k}" aria-current="${k===i?'true':'false'}"><span style="display:block;font-size:.72rem;opacity:.8">LEÇON ${k+1}</span>${esc(l.t)}</button>`).join('')}</div></aside>
    </div>
  </section>`;

function loadLesson(c, i){
  const L=lessonsOf(c); if(i<0||i>=L.length) return;
  const shell=$('#lessonShell'); if(!shell) return;
  const pr=prog[c.id] || (prog[c.id]={done:[],last:0}); pr.last=i; store.set('aes_prog',prog);
  shell.dataset.lesson=String(i);
  const title=$('#activeLessonTitle'), player=$('#lessonPlayer'), status=$('#playerStatus');
  if(title) title.textContent=L[i].t;
  if(!player) return;
  player.innerHTML='<div class="player-message" id="playerMessage"><span class="spin" aria-hidden="true"></span><span>Chargement de la leçon…</span></div>';
  if(status) status.textContent='Chargement du lecteur intégré…';
  const src=embedSrc(L[i].url), parsed=parseDrive(L[i].url);
  if(!src){
    const reason=parsed.err || (parsed.type==='folder'?'Ce lien est un dossier Google Drive, pas une vidéo. Ajoutez les liens individuels des vidéos dans Administration.':'Ce type de ressource ne peut pas être intégré comme vidéo.');
    player.innerHTML=`<div class="player-message"><strong>Vidéo non disponible dans le lecteur</strong><span>${esc(reason)}</span><span>Vérifiez le lien et les autorisations de partage Google Drive.</span></div>`;
    if(status) status.textContent='Impossible de charger cette ressource. Le lien ou les permissions doivent être vérifiés.';
  } else {
    const iframe=document.createElement('iframe'); iframe.title=L[i].t; iframe.src=src; iframe.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; iframe.allowFullscreen=true; iframe.referrerPolicy='strict-origin-when-cross-origin'; iframe.loading='eager';
    let settled=false; const timer=setTimeout(()=>{ if(settled) return; const msg=$('#playerMessage'); if(msg){msg.innerHTML='<strong>Le lecteur met du temps à répondre</strong><span>Vérifiez la connexion et les autorisations de partage de cette vidéo.</span><button class="btn alt" id="retryLesson">Réessayer</button>'; } if(status) status.textContent='Le navigateur ne permet pas de confirmer si la vidéo est lisible. Vérifiez son partage.'; },12000);
    iframe.addEventListener('load',()=>{settled=true;clearTimeout(timer);const msg=$('#playerMessage');if(msg)msg.remove();if(status)status.textContent='Lecteur chargé. Si la vidéo ne démarre pas, le partage Drive peut être restreint.';});
    player.appendChild(iframe);
  }
  $('#lessonList')?.querySelectorAll('[data-ls]').forEach(b=>{const k=+b.dataset.ls;b.classList.toggle('on',k===i);b.setAttribute('aria-current',k===i?'true':'false');});
  document.querySelectorAll('.lesson-tools [data-ls]').forEach(b=>{const k=+b.dataset.ls;b.disabled=k<0||k>=L.length;});
  const fin=$('[data-fin]'); if(fin) fin.dataset.fin=String(i);
}

function route(){
  const h = location.hash || '#/', p = h.split('/'), id = +p[2], c = courses.find(x => x.id === id);
  let html, pg = 'home';
  if(p[1]==='catalogue'){ html = pCat(); pg = 'cat'; }
  else if(p[1]==='course' && c){ html = pCourse(c); pg = 'cat'; }
  else if(p[1]==='learn' && c){ if(!hasAccess(c) || !lessonsOf(c).length){ go('#/course/' + id); return; } cur = c; html = pLearn(c); pg = 'cat'; }
  else { html = pHome(); if(p[1]==='faq') pg = 'faq'; }
  const app = $('#app'); app.innerHTML = html; app.classList.remove('fd'); void app.offsetWidth; app.classList.add('fd');
  document.title = (c && p[1] ? c.title + ' — ' : '') + 'AFRICA E-SCHOOL';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.n === pg));
  $('#nav').classList.remove('on');
  if(pg==='faq') $('#faq').scrollIntoView(); else scrollTo(0,0);
  watch();
  if(p[1]==='learn' && c && lessonsOf(c).length) loadLesson(c, Math.max(0,Math.min(Number((prog[c.id]||{}).last)||0,lessonsOf(c).length-1)));
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.1}) : null;
function watch(){ document.querySelectorAll('.rv').forEach(el => io ? io.observe(el) : el.classList.add('in')); }
function setLesson(c, i, done){
  const pr = prog[c.id] || (prog[c.id] = {done:[], last:0});
  if(done !== undefined && !pr.done.includes(done)) pr.done.push(done);
  pr.last = Math.max(0, Math.min(i, lessonsOf(c).length - 1)); store.set('aes_prog', prog);
  const shell=$('#lessonShell'); if(shell){ const pctNow=pct(c); const bar=shell.querySelector('.bar i');if(bar)bar.style.width=pctNow+'%';const label=shell.querySelector('.bar')?.nextElementSibling;if(label)label.textContent=pctNow+'% terminé · '+lessonsOf(c).length+' leçon(s)';const active=$('#lessonList')?.querySelector('[data-ls="'+done+'"]');if(active && done!==undefined)active.classList.add('dn');const msg=$('#playerStatus');if(msg)msg.textContent='Progression enregistrée sur cet appareil.'; }
}
/* ===== PRÉVISUALISATION ===== */
function pvSet(m){
  const w = {d:'100%', t:'768px', m:'375px'}, f = $('#pvf');
  if(m === 'r'){ m = 'd'; f.src = location.href.split('#')[0].split('?')[0] + '?preview=1'; }
  else if(!f.src) f.src = location.href.split('#')[0].split('?')[0] + '?preview=1' + (location.hash || '');
  f.style.width = w[m]; $('#pvw').classList.toggle('m', m === 'm');
  document.querySelectorAll('[data-pv]').forEach(b => b.classList.toggle('on', b.dataset.pv === m));
}

/* ===== PAIEMENT (pour plus tard) ===== */
async function buy(id){
  if(!CONFIG.checkoutEndpoint){ alert('Le paiement n’est pas encore configuré.'); return; }
  try{
    const r = await fetch(CONFIG.checkoutEndpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({courseId:id})});
    const j = await r.json();
    if(j.url) location.href = j.url; else throw new Error('Réponse invalide');
  }catch(e){ alert('Impossible de lancer le paiement. Réessayez dans un instant.'); }
}
async function syncAccess(){
  if(!CONFIG.accessEndpoint) return;
  try{ const r = await fetch(CONFIG.accessEndpoint, {credentials:'include'}); const j = await r.json(); if(Array.isArray(j.courses)){ ent = j.courses; store.set('aes_ent', ent); render(); } }catch(e){}
}

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn alt" data-a="al">Ajouter une leçon</button><button class="btn" data-a="sv">Enregistrer</button><button class="btn alt" data-a="rm">Supprimer</button></div></details>`).join('')}`;
}
function adminAct(btn){
  const a = btn.dataset.a, det = btn.closest('details'), i = det ? +det.dataset.i : -1;
  const open = det ? det.open : false;
  if(det){ det.querySelectorAll('[data-f]').forEach(el => courses[i][el.dataset.f] = el.value.trim());
    det.querySelectorAll('[data-l]').forEach(el => courses[i].lessons[+el.dataset.l][el.dataset.k] = el.value.trim()); }
  if(a==='chk'){ alert(courses.map(c=>{const e=parseDrive(c.url).err;return e?'• '+c.title+' : '+e:null}).filter(Boolean).join('\n')||'Format de tous les liens valide (accès réel non testé).'); return; }
  log(a+' '+(courses[i]?courses[i].title:''));
  if(a==='add') courses.push({id:Date.now(), title:'Nouvelle formation', cat:'', url:'', note:'', desc:'Description à compléter.', price:'', currency:'USD', status:'free', img:'', lessons:[]});
  if(a==='al') courses[i].lessons.push({t:'Nouvelle leçon', url:''});
  if(a==='dl') courses[i].lessons.splice(+btn.dataset.j, 1);
  if(a==='rm' && confirm('Supprimer cette formation ?')) courses.splice(i, 1);
  if(a==='gr'){ const id = courses[i].id; if(!ent.includes(id)) ent.push(id); store.set('aes_ent', ent); }
  if(a==='rst' && confirm('Remplacer tout le catalogue par la version initiale ?')) courses = JSON.parse(JSON.stringify(DEFAULTS));
  if(a==='exp'){ const b = new Blob([JSON.stringify(courses,null,2)],{type:'application/json'}), l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = 'catalogue.json'; l.click(); return; }
  if(a==='imp'){ const t = prompt('Collez le JSON du catalogue'); if(t){ try{ const j = JSON.parse(t); if(Array.isArray(j)) courses = j; }catch(e){ alert('JSON invalide.'); } } }
  save(); render(); drawAdmin();
  if(open && a!=='rm' && a!=='rst'){ const d = document.querySelector(`#boxAdmin details[data-i="${i}"]`); if(d) d.open = true; }
}

/* ===== ÉVÉNEMENTS ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('button,span[data-r]'); if(!t) return;
  const d = t.dataset;
  if('back' in d) back();
  else if(d.go) go(d.go);
  else if('menu' in d) $('#nav').classList.toggle('on');
  else if(d.scroll) $('#' + d.scroll).scrollIntoView({behavior:'smooth'});
  else if(d.cat){ cat = d.cat; if((location.hash||'#/') === '#/catalogue') route(); else go('#/catalogue'); }
  else if('clearSearch' in d){ term=''; route(); const q=$('#q'); if(q) q.focus(); }
  else if(d.previewLesson !== undefined){ const c=courses.find(x=>x.id===+d.course); if(c && lessonsOf(c).length) { if(hasAccess(c)) { prog[c.id]=prog[c.id]||{done:[],last:0};prog[c.id].last=+d.previewLesson;store.set('aes_prog',prog);go('#/learn/'+c.id); } else openFree(c.id); } }
  else if(d.ls !== undefined){ if(!t.disabled && cur){ const L=lessonsOf(cur);const idx=+d.ls;if(idx>=0&&idx<L.length){ loadLesson(cur,idx); } } }
  else if('cinema' in d){ $('#lessonLayout')?.classList.toggle('cinema'); t.textContent=$('#lessonLayout')?.classList.contains('cinema')?'Quitter le mode cinéma':'Mode cinéma'; }
  else if('toggleLessons' in d){ const side=$('#lessonSidebar');if(side){side.hidden=!side.hidden;t.setAttribute('aria-expanded',String(!side.hidden));t.textContent=side.hidden?'Afficher les leçons':'Masquer les leçons';} }
  else if('fullscreen' in d){ const el=$('#lessonPlayer');if(el?.requestFullscreen) el.requestFullscreen().catch(()=>alert('Le plein écran n’est pas disponible dans ce navigateur.'));else alert('Le plein écran n’est pas pris en charge par ce navigateur.'); }
  else if(t.id==='retryLesson'){ if(cur) loadLesson(cur,Number($('#lessonShell')?.dataset.lesson)||0); }
  else if(d.fin !== undefined && cur) setLesson(cur, Number($('#lessonShell')?.dataset.lesson)||+d.fin, +d.fin);
  else if(d.free){ const c = courses.find(x => x.id === +d.free); if(user) go('#/learn/' + c.id); else openFree(c.id); }
  else if(d.close) $('#' + d.close).classList.remove('on');
  else if(d.pv){ pvSet(d.pv); }
  else if('pvopen' in d){ $('#ovPrev').classList.add('on'); pvSet('d'); }
  else if(d.r){ const a = ratings[cur.id] || (ratings[cur.id] = []); a.push(+d.r); store.set('aes_ratings', ratings); t.parentNode.querySelectorAll('span').forEach(s => s.classList.toggle('on', +s.dataset.r <= +d.r)); }
  else if(d.a) adminAct(t);
  else if(t.id === 'bAdmin') openAdmin();
  else if(t.id === 'fGo'){
    const n = $('#fName').value.trim(), m = $('#fMail').value.trim();
    if(!n || !/^\S+@\S+\.\S+$/.test(m)){ $('#fErr').textContent = 'Saisissez votre nom et une adresse e-mail valide.'; return; }
    if(!$('#fOk').checked){ $('#fErr').textContent = 'Acceptez les conditions pour continuer.'; return; }
    user = {name:n, mail:m}; store.set('aes_user', user);
    $('#ovFree').classList.remove('on'); go('#/learn/' + d.id);
  }
});
document.addEventListener('input', e => { if(e.target.id === 'q'){ term = e.target.value.toLowerCase().trim(); const pos = e.target.selectionStart; route(); const q = $('#q'); if(q){q.focus();q.setSelectionRange(pos,pos);} } else if(e.target.id==='lessonFilter'){ const q=e.target.value.toLowerCase().trim(); $('#lessonList')?.querySelectorAll('button[data-ls]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q)); } });
document.addEventListener('change', e => { if(e.target.id === 'fp'){ fprice = e.target.value; route(); } if(e.target.id === 'so'){ sort = e.target.value; route(); } });
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelectorAll('.ov.on').forEach(o => o.classList.remove('on')); });
if(PV){ const b = $('#bAdmin'); if(b) b.remove(); }
route(); syncAccess();
</script>
</body>
